name: "Release a tag"
on:
  push:
    tags:
      - v*
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish for a release"
        required: false
        type: string
        default: ""

jobs:
  release:
    name: Release Process
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CGO_ENABLED: 0

    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: ghcr-login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Renovate rescan
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          num=$(gh issue list --state open --search "Dependency Dashboard in:title" \
                --json number --jq '.[0].number')
          [ -z "$num" ] && { echo "No dashboard issue found"; exit 0; }
          gh issue view "$num" --json body --jq .body > body.md
          if grep -q -- '- \[x\] <!-- manual job -->' body.md; then
            echo "Checkbox already ticked, a run is already requested"
            exit 0
          fi
          if ! grep -q -- '- \[ \] <!-- manual job -->' body.md; then
            echo "Manual job checkbox not found in issue #$num"
            exit 1
          fi
          sed -i 's/- \[ \] <!-- manual job -->/- [x] <!-- manual job -->/' body.md
          gh issue edit "$num" --body-file body.md
          echo "Ticked manual job checkbox on issue #$num"